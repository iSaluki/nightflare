name = "nightflare"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Optional: serve this site from your own domain instead of the default
# <name>.<subdomain>.workers.dev URL. The Deploy to Cloudflare button can't
# prompt for this inline (it only provisions whatever's declared here), so
# it's a two-step process instead: after deploying, uncomment this block,
# set `pattern` to your domain (it must already be added as a zone on this
# same Cloudflare account — Websites -> Add a domain in the dashboard if
# it isn't yet), then redeploy (`npm run deploy`, or push to your fork if
# using the button's auto-deploy-on-push). Equivalently, skip this file
# entirely and add the domain via the dashboard instead: your Worker's page
# -> Settings -> Domains & Routes -> Add -> Custom Domain.
# [[routes]]
# pattern = "nightscout.example.com"
# custom_domain = true

# Web UI: the vendored (unmodified) Nightscout client bundle + pre-rendered
# page shells (index/admin/food/profile/report), served as plain static
# multi-page assets — not an SPA.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/admin", "/food", "/profile", "/report", "/api/*", "/pebble", "/pebble/*", "/rt", "/rt/*"]

# Primary datastore: entries, treatments, devicestatus, profile, food, activity, auth.
[[d1_databases]]
binding = "DB"
database_name = "nightflare-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Small key/value lookups: site settings cache, short-lived import job state, JWT denylist.
[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# One Durable Object instance per deployed site, fans out realtime updates to connected browsers.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

# One Durable Object instance per import job; uses alarms to pull data from
# a source Nightscout instance in paginated batches, well outside any
# single HTTP request's time budget.
[[durable_objects.bindings]]
name = "IMPORT_JOB"
class_name = "ImportJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub", "ImportJob"]

[vars]
# Display name shown in the web UI header.
SITE_TITLE = "Nightflare"
# Comma-separated list of enabled "plugins" surfaced to the client (mirrors Nightscout ENABLE env var).
ENABLE = "careportal rawbg iob cob bwp basal ar2 delta direction upbat"
# Units used for display: "mg/dl" or "mmol/L".
DISPLAY_UNITS = "mg/dl"
# When "true", the root "/" dashboard serves Nightflare's own modern UI
# instead of the vendored Nightscout client. Only the dashboard is affected —
# /admin, /food, /profile, and /report always stay on the vendored UI.
NEW_UI = "false"
# Role(s) (space- or comma-separated, matching auth_roles.name) granted to a
# request presenting no api-secret/token at all. Defaults to "denied" (no
# access whatsoever, including to glucose data) when this is unset — unlike
# stock Nightscout, whose historical AUTH_DEFAULT_ROLES default is
# "readable" (glucose data visible to anyone with the URL, no token
# required). Set to "readable" here explicitly if you actually want that
# stock behavior back.
AUTH_DEFAULT_ROLES = "denied"

# Secrets (set with `wrangler secret put API_SECRET`), not committed:
#   API_SECRET - plaintext master secret; clients send sha1(API_SECRET) as the api-secret header,
#                exactly like stock Nightscout. The web UI hashes it client-side before sending too.
