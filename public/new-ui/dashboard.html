<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nightflare</title>
<link rel="icon" type="image/png" href="/images/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="/new-ui/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="12" stroke="var(--border-strong)" stroke-width="1"/>
        <path class="wave-path" d="M3 14 L9 14 L11 8 L14 19 L16 11 L18 14 L23 14"
          stroke="var(--zone-in)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span id="site-title">Nightflare</span>
    </div>
    <div class="spacer"></div>
    <div class="conn-status" id="conn-status"><span class="conn-dot"></span><span id="conn-label">Connecting</span></div>
    <a class="icon-btn" href="/admin" aria-label="Admin tools" title="Admin tools (vendored Nightscout UI)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.14.36.4.68.73.9.24.16.51.26.8.3H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </a>
    <button class="icon-btn" id="auth-btn" aria-label="Authenticate">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
    </button>
  </header>

  <main>
    <section class="card vitals-strip">
      <div class="reading" id="reading">
        <div class="reading-value-row">
          <span class="reading-value" id="bg-value">–</span>
          <span class="reading-arrow" id="bg-arrow"></span>
        </div>
        <div class="reading-meta">
          <span id="bg-delta">no data yet</span>
        </div>
        <div class="units-toggle" id="bg-units">mg/dl</div>
      </div>
      <div class="graph-wrap">
        <svg id="bg-graph" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
        <div class="range-select" id="range-select">
          <button data-hours="1">1h</button>
          <button data-hours="3" class="active">3h</button>
          <button data-hours="6">6h</button>
          <button data-hours="12">12h</button>
          <button data-hours="24">24h</button>
        </div>
      </div>
    </section>

    <section class="instrument-row" id="instrument-row"></section>

    <section class="card timeline-section">
      <h2>Recent activity</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <p class="footer-note">Nightflare · <a href="/report">Reports</a> · <a href="/profile">Profile</a> · <a href="/food">Food</a> · <a href="/admin">Admin</a></p>
  </main>

  <button class="fab" id="add-treatment-fab" aria-label="Log a treatment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="modal-backdrop" id="auth-backdrop">
    <div class="modal">
      <h3>Authenticate</h3>
      <p class="muted">Enter your API secret or an access token. It's hashed in your browser before being sent — never stored or transmitted in plain text.</p>
      <div class="field">
        <label for="auth-input">API secret or token</label>
        <input id="auth-input" type="password" autocomplete="off" />
      </div>
      <div class="form-status" id="auth-status"></div>
      <div class="modal-actions">
        <button class="ghost" data-close="auth-backdrop">Cancel</button>
        <button class="primary" id="auth-submit">Authenticate</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="treatment-backdrop">
    <div class="modal">
      <h3>Log a treatment</h3>
      <form id="treatment-form">
        <div class="field">
          <label for="t-event-type">Event type</label>
          <select id="t-event-type" name="eventType">
            <option>Meal Bolus</option>
            <option>Correction Bolus</option>
            <option>Snack Bolus</option>
            <option>Carb Correction</option>
            <option>BG Check</option>
            <option>Exercise</option>
            <option>Note</option>
            <option>Site Change</option>
            <option>Sensor Change</option>
            <option>Insulin Cartridge Change</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="t-carbs">Carbs (g)</label>
            <input id="t-carbs" name="carbs" type="number" step="1" min="0" />
          </div>
          <div class="field">
            <label for="t-insulin">Insulin (u)</label>
            <input id="t-insulin" name="insulin" type="number" step="0.05" min="0" />
          </div>
        </div>
        <div class="field">
          <label for="t-notes">Notes</label>
          <textarea id="t-notes" name="notes" rows="2"></textarea>
        </div>
        <div class="form-status" id="treatment-status"></div>
        <div class="modal-actions">
          <button type="button" class="ghost" data-close="treatment-backdrop">Cancel</button>
          <button type="submit" class="primary">Save treatment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/new-ui/app.js"></script>
</body>
</html>
